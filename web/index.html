<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>实践教学资源比较台</title><link rel="stylesheet" href="/style.css"></head>
<body><header><span>教研数据 · 复核工作区</span><h1>实践教学资源比较台</h1><p>投入产出核对与相对效率讨论依据（非绩效排名）</p></header>
<main><aside><h2>数据与范围</h2><label>数据版本<select id="revision"></select></label><div id="controls"></div>
<button id="inspect">查看所选范围</button><label>导入完整数据<input id="upload" type="file" accept=".json,application/json"></label>
<button id="raw">查看原始记录</button><h2>分析记录</h2><label>记录名称<input id="title" value="本次复核"></label>
<button id="save">保存当前描述</button><div id="archive"></div></aside>
<section><div id="status" role="status">正在读取本地数据…</div><div id="summary"></div>
<h2>中心投入产出原始比率</h2><div id="notes"></div><canvas id="chart" width="960" height="300" aria-label="所选范围描述图"></canvas>
<div class="table-wrap"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></div>
<h2>相对效率与改进空间（投入导向 DEA，不作排名）</h2>
<div id="efficiency-notes" class="method-notes"></div>
<div id="efficiency-boundaries" class="boundaries"></div>
<canvas id="efficiency-chart" width="960" height="300" aria-label="相对效率得分图，按中心原始顺序展示"></canvas>
<div class="table-wrap"><table><thead id="efficiency-columns"></thead><tbody id="efficiency-rows"></tbody></table></div>
<div id="stability" class="stability"></div>
<h2 id="detail-heading">记录与依据</h2><pre id="details">点击记录行可查看详细字段。</pre><button id="export">导出当前记录</button>
</section></main><footer>仅使用本地虚构记录；相对效率是组内前沿距离，用于资源讨论，不替代研究设计、业务复核或管理认定。</footer><script src="/app.js"></script></body></html>
